<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday!</title>
<link href="https://fonts.googleapis.com/css2?family=Shrikhand&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --plum:#3B1240; --pink:#FF4F8B; --sun:#FFC83D; --mint:#3DDBB0; --sky:#5BA8FF; --paper:#FFF6EE;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Outfit',sans-serif; color:var(--plum);
    background:radial-gradient(circle at 50% 30%, #5A1D63 0%, var(--plum) 70%);
    overflow-x:hidden; min-height:100vh;
  }
  canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:50}
  .balloons{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
  .balloon{position:absolute;bottom:-180px;width:70px;animation:rise linear forwards}
  @keyframes rise{
    0%{transform:translateY(0) rotate(-4deg)}
    50%{transform:translateY(-60vh) rotate(5deg)}
    100%{transform:translateY(-130vh) rotate(-3deg)}
  }

  /* Gift stage */
  .stage{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center}
  .to{font-family:'Shrikhand',cursive;color:var(--sun);font-size:clamp(28px,7vw,48px);line-height:1.1}
  .gift{position:relative;width:200px;height:190px;cursor:pointer;border:none;background:none;animation:wiggle 2.4s ease-in-out infinite}
  .gift:focus-visible{outline:4px dashed var(--sun);outline-offset:12px;border-radius:12px}
  @keyframes wiggle{0%,80%,100%{transform:rotate(0)}85%{transform:rotate(-5deg)}90%{transform:rotate(5deg)}95%{transform:rotate(-3deg)}}
  .box{position:absolute;bottom:0;left:15px;width:170px;height:130px;background:var(--pink);border-radius:6px}
  .lid{position:absolute;top:22px;left:0;width:200px;height:44px;background:#FF6FA0;border-radius:6px;transition:transform .7s cubic-bezier(.3,1.6,.5,1),opacity .7s}
  .ribbon-v{position:absolute;left:50%;transform:translateX(-50%);width:28px;height:100%;background:var(--sun)}
  .bow{position:absolute;top:-30px;left:50%;transform:translateX(-50%);width:80px;height:40px}
  .bow::before,.bow::after{content:"";position:absolute;top:0;width:40px;height:36px;border:9px solid var(--sun);border-radius:50% 50% 50% 50%}
  .bow::before{left:-4px;transform:rotate(-20deg)}
  .bow::after{right:-4px;transform:rotate(20deg)}
  .gift.open{animation:none}
  .gift.open .lid{transform:translate(60px,-260px) rotate(40deg);opacity:0}
  .hint{color:var(--paper);font-size:18px;opacity:.85}

  /* Card */
  .card{display:none;max-width:560px;margin:48px auto;padding:0 18px 60px;position:relative;z-index:30}
  .card.show{display:block;animation:pop .8s cubic-bezier(.3,1.5,.5,1)}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
  .sheet{background:var(--paper);border-radius:22px;padding:36px 28px 30px;box-shadow:0 20px 0 var(--pink)}
  h1{font-family:'Shrikhand',cursive;font-weight:400;font-size:clamp(40px,11vw,68px);line-height:1;color:var(--pink);text-align:center;transform:rotate(-3deg)}
  .name{display:block;color:var(--plum);font-size:.8em;margin-top:8px}
  .love{text-align:center;font-size:19px;line-height:1.55;margin:26px auto 28px;max-width:40ch}
  .crew{list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .crew li{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:12px;font-weight:600;font-size:16px;opacity:0;animation:drop .5s forwards}
  .crew li:nth-child(4n+1){background:#FFE1EC}
  .crew li:nth-child(4n+2){background:#FFF0C2}
  .crew li:nth-child(4n+3){background:#D3F7EC}
  .crew li:nth-child(4n+4){background:#DCEBFF}
  .crew span:last-child{font-weight:800}
  @keyframes drop{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:none}}
  .total{margin-top:22px;background:var(--plum);color:var(--sun);border-radius:16px;padding:18px;text-align:center}
  .total b{display:block;font-family:'Shrikhand',cursive;font-weight:400;font-size:44px;line-height:1.1}
  .total small{font-size:15px;color:var(--paper)}
  .sign{text-align:center;margin-top:22px;font-size:18px;font-weight:600}
  .again{display:block;margin:26px auto 0;background:var(--sun);color:var(--plum);border:none;font:800 16px 'Outfit',sans-serif;padding:14px 26px;border-radius:999px;cursor:pointer}
  .again:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
  @media (max-width:420px){.crew{grid-template-columns:1fr}}
  @media (prefers-reduced-motion:reduce){
    .gift{animation:none}.balloon{display:none}.card.show,.crew li{animation:none;opacity:1}
  }
</style>
</head>
<body>

<canvas id="fx"></canvas>
<div class="balloons" id="balloons"></div>

<section class="stage" id="stage">
  <p class="to" id="toLine">For you</p>
  <button class="gift" id="gift" aria-label="Open your birthday gift">
    <div class="lid"><div class="ribbon-v"></div><div class="bow"></div></div>
    <div class="box"><div class="ribbon-v"></div></div>
  </button>
  <p class="hint">Tap the gift to open it</p>
</section>

<main class="card" id="card">
  <div class="sheet">
    <h1>Happy Birthday<span class="name" id="nameLine"></span></h1>
    <p class="love">We pooled together to spoil you a little. You make every one of our lives brighter. We love you, today and always.</p>
    <ul class="crew" id="crew"></ul>
    <div class="total">
      <small>Your birthday fund</small>
      <b id="total"></b>
    </div>
    <p class="sign">With all our love, your girls 💖</p>
  </div>
  <button class="again" id="again">Celebrate again</button>
</main>

<script>
/* ===== EDIT HERE ===== */
const BIRTHDAY_NAME = "Siwar";   // shown on the card headline
const NICKNAME = "Sus";          // shown on the gift box
const CURRENCY = "JD";
const CREW = [
  ["Haya",50],["Nadine",100],["ZJ",50],["Hindo",50],["Leen",50],
  ["Zam",100],["Susu",100],["Dana",70],["Steph",50],["Naf",70],
  ["Natasha",70],["Ayah",50],["Christina",100],["Ruba",50]
];
/* ===================== */

const name = new URLSearchParams(location.search).get("name") || BIRTHDAY_NAME;
if (name){
  document.getElementById("toLine").textContent = "For " + (NICKNAME || name);
  document.getElementById("nameLine").textContent = name;
  document.title = "Happy Birthday " + name + "!";
}

const crewEl = document.getElementById("crew");
CREW.sort((a,b)=>a[0].localeCompare(b[0]));
CREW.forEach(([n,a],i)=>{
  const li = document.createElement("li");
  li.style.animationDelay = (0.6 + i*0.08) + "s";
  li.innerHTML = `<span>${n}</span><span>${a} ${CURRENCY}</span>`;
  crewEl.appendChild(li);
});
const total = CREW.reduce((s,[,a])=>s+a,0);
document.getElementById("total").textContent = total + " " + CURRENCY;

const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
const colors = ["#FF4F8B","#FFC83D","#3DDBB0","#5BA8FF","#FFFFFF","#B57BFF"];

/* Confetti */
const cv = document.getElementById("fx"), ctx = cv.getContext("2d");
let parts = [], running = false;
function size(){cv.width = innerWidth*devicePixelRatio; cv.height = innerHeight*devicePixelRatio; ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}
addEventListener("resize", size); size();
function burst(x,y,count){
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2, sp = 4+Math.random()*10;
    parts.push({x,y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp-6,w:6+Math.random()*7,h:4+Math.random()*5,
      r:Math.random()*6,vr:(Math.random()-.5)*.3,c:colors[i%colors.length],life:0});
  }
  if(!running){running=true;requestAnimationFrame(tick)}
}
function rain(){
  for(let i=0;i<120;i++){
    parts.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,
      w:6+Math.random()*6,h:4+Math.random()*4,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:colors[i%colors.length],life:0});
  }
}
function tick(){
  ctx.clearRect(0,0,innerWidth,innerHeight);
  parts.forEach(p=>{
    p.vy += .18; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.r += p.vr; p.life++;
    ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.r); ctx.fillStyle=p.c;
    ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.life*.1))+1); ctx.restore();
  });
  parts = parts.filter(p=>p.y < innerHeight+40);
  if(parts.length) requestAnimationFrame(tick); else {running=false; ctx.clearRect(0,0,innerWidth,innerHeight)}
}

/* Balloons */
function balloons(n){
  const wrap = document.getElementById("balloons");
  for(let i=0;i<n;i++){
    const c = colors[i%5], b = document.createElement("div");
    b.className = "balloon";
    b.style.left = (Math.random()*92) + "vw";
    b.style.animationDuration = (6+Math.random()*5) + "s";
    b.style.animationDelay = (Math.random()*2.5) + "s";
    b.style.transform = `scale(${.7+Math.random()*.6})`;
    b.innerHTML = `<svg viewBox="0 0 70 170"><ellipse cx="35" cy="40" rx="30" ry="38" fill="${c}"/>
      <ellipse cx="24" cy="26" rx="7" ry="11" fill="#fff" opacity=".35"/>
      <polygon points="30,77 40,77 35,84" fill="${c}"/>
      <path d="M35 84 Q28 110 38 130 T34 170" stroke="#fff" stroke-width="1.5" fill="none" opacity=".7"/></svg>`;
    wrap.appendChild(b);
    setTimeout(()=>b.remove(), 14000);
  }
}

function celebrate(x,y){
  if(reduced) return;
  burst(x,y,220); setTimeout(rain,500); balloons(16);
}

const gift = document.getElementById("gift");
gift.addEventListener("click", ()=>{
  const r = gift.getBoundingClientRect();
  gift.classList.add("open");
  celebrate(r.left+r.width/2, r.top+40);
  setTimeout(()=>{
    document.getElementById("stage").style.display="none";
    document.getElementById("card").classList.add("show");
    scrollTo(0,0);
  }, 900);
});
document.getElementById("again").addEventListener("click", e=>{
  celebrate(innerWidth/2, innerHeight/3);
});
</script>
</body>
</html>
